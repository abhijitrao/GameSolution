plugins { id 'com.android.application' }

android {
    namespace 'com.abhijit.gamesolution'
    compileSdk 35

    defaultConfig {
        applicationId 'com.abhijit.gamesolution'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '2.0'
    }

    signingConfigs {
        if (System.getenv('GAME_KEYSTORE_FILE') != null) {
            release {
                storeFile file(System.getenv('GAME_KEYSTORE_FILE'))
                storePassword System.getenv('GAME_KEYSTORE_PASSWORD')
                keyAlias System.getenv('GAME_KEY_ALIAS')
                keyPassword System.getenv('GAME_KEY_PASSWORD') ?: System.getenv('GAME_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv('GAME_KEYSTORE_FILE') != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }
}

dependencies {
}
