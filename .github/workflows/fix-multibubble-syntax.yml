name: Fix MultiBubbleManager syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'abhijitrao' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix syntax and remove temporary workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/abhijit/gamesolution/MultiBubbleManager.java')
          s = p.read_text()
          old = 'z.setBackground(round(Color.rgb(95,31,43),40);'
          new = 'z.setBackground(round(Color.rgb(95,31,43),40));'
          if old not in s:
              raise SystemExit('Expected syntax error not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/fix-multibubble-syntax.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/abhijit/gamesolution/MultiBubbleManager.java .github/workflows/fix-multibubble-syntax.yml
          git commit -m 'Fix MultiBubbleManager syntax error'
          git push
