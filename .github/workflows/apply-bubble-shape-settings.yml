P:if(dragging){boolean remove=deleteZoneActive;vibrate(remove?35:12);if(remove){animateDeleteAndStop(bubble);return true;}hideDeleteZone();if(BubbleSettings.isSnapToEdge(this)){snapToEdge(params,width,sw);}else savePosition(params,sw,sh,width);return true;}vibrate(18);if(LiveMonitorDialog.isShowing()){LiveMonitorDialog.dismiss();return true;}if(AppDetailInfoDialog.isShowing()){AppDetailInfoDialog.dismissFromBubbleTap();return true;}if(menuView!=null){removeMenu();return true;}openMenu(params.x,params.y,width);return true;}return false;});bubbleView=bubble;windowManager.addView(bubbleView,params);}
