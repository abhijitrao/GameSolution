name: Apply Bubble Shape Settings

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply rounded square implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_all(path, replacements):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              original = s
              for old, new in replacements:
                  if old not in s:
                      raise SystemExit(f'Pattern not found in {path}: {old[:100]}')
                  s = s.replace(old, new)
              if s != original:
                  p.write_text(s, encoding='utf-8')

          # Update the generated CI source so it no longer recreates OVAL mode.
          workflow = Path('.github/workflows/android.yml')
          w = workflow.read_text(encoding='utf-8')
          w = w.replace('BubbleSettings.getShape(this).equals("OVAL")', 'BubbleSettings.getShape(this).equals("SQUARE")')
          w = w.replace('BubbleSettings.setShape(this,"OVAL")', 'BubbleSettings.setShape(this,"SQUARE")')
          w = w.replace('TextView oval=label("OVAL",12,Color.WHITE,Typeface.BOLD);', 'TextView oval=label("ROUNDED SQUARE",12,Color.WHITE,Typeface.BOLD);')
          w = w.replace('boolean ovalMode=BubbleSettings.getShape(this).equals("SQUARE");', 'boolean ovalMode=BubbleSettings.getShape(this).equals("SQUARE");')
          old_bg = 'GradientDrawable bg=new GradientDrawable(GradientDrawable.Orientation.TL_BR,new int[]{Color.rgb(125,155,255),Color.rgb(72,91,205)});bg.setShape(GradientDrawable.OVAL);bg.setStroke(dp(2),Color.argb(80,255,255,255));bubble.setBackground(bg);'
          new_bg = 'GradientDrawable bg=new GradientDrawable(GradientDrawable.Orientation.TL_BR,new int[]{Color.rgb(125,155,255),Color.rgb(72,91,205)});bg.setShape(BubbleSettings.getShape(this).equals("SQUARE")?GradientDrawable.RECTANGLE:GradientDrawable.OVAL);bg.setCornerRadius(dp(18));bg.setStroke(dp(2),Color.argb(80,255,255,255));bubble.setBackground(bg);if(BubbleSettings.getShape(this).equals("SQUARE"))bubble.setText("");'
          w = w.replace(old_bg, new_bg)
          w = w.replace('bubble.setText("i");bubble.setTextColor', 'bubble.setText("i");bubble.setTextColor')
          workflow.write_text(w, encoding='utf-8')

          # Update the checked-in source as well, so it matches CI behavior.
          f = Path('app/src/main/java/com/abhijit/gamesolution/FloatingService.java')
          s = f.read_text(encoding='utf-8')
          s = s.replace('BubbleSettings.getShape(this).equals("OVAL")', 'BubbleSettings.getShape(this).equals("SQUARE")')
          s = s.replace('BubbleSettings.setShape(this,"OVAL")', 'BubbleSettings.setShape(this,"SQUARE")')
          s = s.replace('label("OVAL",12,Color.WHITE,Typeface.BOLD)', 'label("ROUNDED SQUARE",12,Color.WHITE,Typeface.BOLD)')
          s = s.replace('GradientDrawable bg=new GradientDrawable(GradientDrawable.Orientation.TL_BR,new int[]{Color.rgb(125,155,255),Color.rgb(72,91,205)});bg.setShape(GradientDrawable.OVAL);bg.setStroke(dp(2),Color.argb(80,255,255,255));bubble.setBackground(bg);', 'GradientDrawable bg=new GradientDrawable(GradientDrawable.Orientation.TL_BR,new int[]{Color.rgb(125,155,255),Color.rgb(72,91,205)});bg.setShape(BubbleSettings.getShape(this).equals("SQUARE")?GradientDrawable.RECTANGLE:GradientDrawable.OVAL);bg.setCornerRadius(dp(18));bg.setStroke(dp(2),Color.argb(80,255,255,255));bubble.setBackground(bg);if(BubbleSettings.getShape(this).equals("SQUARE"))bubble.setText("");')
          # Make shape changes immediately update the actual background and icon.
          marker = 'bubbleView.setAlpha(BubbleSettings.getTransparency(this)/100f);windowManager.updateViewLayout(bubbleView,p);'
          replacement = 'bubbleView.setAlpha(BubbleSettings.getTransparency(this)/100f);GradientDrawable shapeBg=new GradientDrawable(GradientDrawable.Orientation.TL_BR,new int[]{Color.rgb(125,155,255),Color.rgb(72,91,205)});boolean square=BubbleSettings.getShape(this).equals("SQUARE");shapeBg.setShape(square?GradientDrawable.RECTANGLE:GradientDrawable.OVAL);shapeBg.setCornerRadius(dp(18));shapeBg.setStroke(dp(2),Color.argb(80,255,255,255));bubbleView.setBackground(shapeBg);if(bubbleView instanceof TextView)((TextView)bubbleView).setText(square?"":"i");windowManager.updateViewLayout(bubbleView,p);'
          if marker in s:
              s = s.replace(marker, replacement, 1)
          f.write_text(s, encoding='utf-8')

          # Change the persisted shape representation from OVAL to SQUARE.
          bs = Path('app/src/main/java/com/abhijit/gamesolution/BubbleSettings.java')
          if bs.exists():
              b = bs.read_text(encoding='utf-8')
              b = b.replace('"OVAL"', '"SQUARE"')
              b = b.replace('"oval"', '"square"')
              b = b.replace('isOval', 'isSquare')
              b = b.replace('setOval', 'setSquare')
              bs.write_text(b, encoding='utf-8')
          PY

      - name: Commit rounded square changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/abhijit/gamesolution/FloatingService.java app/src/main/java/com/abhijit/gamesolution/BubbleSettings.java .github/workflows/android.yml
          git commit -m "Replace oval bubble with rounded square"
          git push

      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/apply-bubble-shape-settings.yml
          git commit -m "Remove bubble shape migration workflow"
          git push
