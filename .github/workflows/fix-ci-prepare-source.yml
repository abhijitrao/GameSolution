name: Fix CI Prepare Source

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix clamp signature in Android CI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/android.yml')
          s = p.read_text(encoding='utf-8')
          old = "s=replace_method(s,'private void clampBubbleX(int x,int widthPx,int sw)',clamp_method)"
          new = "s=replace_method(s,'private int clampBubbleX(int x,int widthPx,int sw)',clamp_method)"
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print('Fixed broken clamp signature')
          else:
              print('Clamp signature already fixed')
          PY
          if git diff --quiet -- .github/workflows/android.yml; then
            echo "No workflow change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/android.yml
          git commit -m "Fix CI prepare source clamp signature"
          git push
      - name: Remove temporary repair workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-ci-prepare-source.yml
          git commit -m "Remove temporary CI repair workflow"
          git push