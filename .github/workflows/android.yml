            TextView snap=label("Snap to Edge: "+(BubbleSettings.isSnapToEdge(this)?"ON":"OFF"),14,text,Typeface.BOLD);snap.setGravity(Gravity.CENTER_VERTICAL);snap.setPadding(dp(12),0,dp(12),0);snap.setBackground(round(Color.rgb(38,46,66),14));snap.setOnClickListener(v->{boolean n=!BubbleSettings.isSnapToEdge(this);BubbleSettings.setSnapToEdge(this,n);snap.setText("Snap to Edge: "+(n?"ON":"OFF"));});box.addView(snap,rowLp(dp(48),dp(8)));
            Runnable refresh=()->{boolean ovalMode=BubbleSettings.getShape(this).equals("OVAL");sb.setVisibility(ovalMode?View.GONE:View.VISIBLE);sv.setVisibility(ovalMode?View.GONE:View.VISIBLE);wv.setVisibility(ovalMode?View.VISIBLE:View.GONE);wb.setVisibility(ovalMode?View.VISIBLE:View.GONE);hv.setVisibility(ovalMode?View.VISIBLE:View.GONE);hb.setVisibility(ovalMode?View.VISIBLE:View.GONE);circle.setBackground(round(ovalMode?Color.rgb(38,46,66):primary,12));oval.setBackground(round(ovalMode?primary:Color.rgb(38,46,66),12));};
