name: Android CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore signing keystore
        if: ${{ github.event_name != 'pull_request' }}
        env:
          KEYSTORE_B64: ${{ secrets.GAME_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then exit 1; fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/gamesolution-release.jks"
          echo "GAME_KEYSTORE_FILE=$RUNNER_TEMP/gamesolution-release.jks" >> "$GITHUB_ENV"
      - name: Prepare source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/abhijit/gamesolution/LiveMonitorDialog.java')
          t=p.read_text(encoding='utf-8')
          marker='    private static int readCpuPercent(int pid) {'
          if 'private static int findPid(ActivityManager am, String packageName)' not in t:
            m='\n'.join(['    private static int findPid(ActivityManager am, String packageName) {','        if (am == null || packageName == null) return -1;','        try {','            java.util.List<ActivityManager.RunningAppProcessInfo> processes = am.getRunningAppProcesses();','            if (processes == null) return -1;','            for (ActivityManager.RunningAppProcessInfo process : processes) {','                if (process != null && packageName.equals(process.processName)) return process.pid;','            }','        } catch (Exception ignored) {}','        return -1;','    }',''])
            if marker not in t: raise SystemExit('LiveMonitor marker not found')
            p.write_text(t.replace(marker,m+marker,1),encoding='utf-8')
          f=Path('app/src/main/java/com/abhijit/gamesolution/FloatingService.java')
          s=f.read_text(encoding='utf-8')
          # Recent Apps: four fixed-size icons, full row height, and edge-to-edge alignment.
          s=s.replace('row.setPadding(dp(8),0,dp(8),0);','row.setPadding(0,0,0,0);')
          s=s.replace('d.setBounds(0,0,dp(32),dp(32));','d.setBounds(0,0,dp(54),dp(54));')
          s=s.replace('d.setBounds(0,0,dp(48),dp(48));','d.setBounds(0,0,dp(54),dp(54));')
          s=s.replace('row.addView(icon,new LinearLayout.LayoutParams(0,dp(54),1));if(++count>=5)break;','row.addView(icon,new LinearLayout.LayoutParams(dp(54),dp(54)));if(++count>=4)break;TextView spacer=label("",1,text,Typeface.NORMAL);row.addView(spacer,new LinearLayout.LayoutParams(0,dp(54),1));')
          s=s.replace('row.addView(icon,new LinearLayout.LayoutParams(0,dp(54),1));if(++count>=4)break;','row.addView(icon,new LinearLayout.LayoutParams(dp(54),dp(54)));if(++count>=4)break;TextView spacer=label("",1,text,Typeface.NORMAL);row.addView(spacer,new LinearLayout.LayoutParams(0,dp(54),1));')
          # Launch recent apps through the existing task when possible.
          s=s.replace('i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK|Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED);','i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK|Intent.FLAG_ACTIVITY_SINGLE_TOP);')
          # Semi Icon Visible: keep exactly one third of the bubble visible at either edge.
          s=s.replace('int hidden=w/3;return Math.max(-hidden,Math.min(x,sw-w+hidden));','int hidden=(w*2)/3;return Math.max(-hidden,Math.min(x,sw-w/3));')
          s=s.replace('target=(p.x+w/2<sw/2)?-w/3:sw-(2*w/3);','target=(p.x+w/2<sw/2)?-(2*w/3):sw-(w/3);')
          s=s.replace('p.x=enabled?(p.x+w/2<sw/2?-w/3:sw-2*w/3):(p.x<sw/2?0:sw-w);','p.x=enabled?(p.x+w/2<sw/2?-(2*w)/3:sw-w/3):(p.x<sw/2?0:sw-w);')
          # Keep the selected edge anchored while changing bubble size.
          old_apply='boolean wasRight=(p.x+oldW>=getResources().getDisplayMetrics().widthPixels-dp(2));boolean wasLeft=p.x<=dp(2);float cx=p.x+oldW/2f,cy=p.y+old/2f;p.width=newW;p.height=newW;p.x=Math.max(dp(4),Math.min((int)(cx-newW/2f),getResources().getDisplayMetrics().widthPixels-dp(size+4)));'
          new_apply='boolean wasRight=(p.x+oldW>=getResources().getDisplayMetrics().widthPixels-dp(2));boolean wasLeft=p.x<=dp(2);float cx=p.x+oldW/2f,cy=p.y+old/2f;p.width=newW;p.height=newW;int sw2=getResources().getDisplayMetrics().widthPixels;int newX;if(BubbleSettings.isSemiIconVisible(this)){newX=wasLeft?-(2*newW)/3:(wasRight?sw2-newW/3:(int)(cx-newW/2f));}else{newX=wasLeft?0:(wasRight?sw2-newW:(int)(cx-newW/2f));}p.x=clampBubbleX(newX,size,sw2);'
          s=s.replace(old_apply,new_apply)
          f.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/abhijit/gamesolution/FloatingService.java
          if ! git diff --cached --quiet; then
            git commit -m "Fix semi icon edge positioning"
            git push
          fi
      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Run Android Lint
        run: gradle lintDebug --stacktrace
      - name: Build debug APK
        if: ${{ github.event_name == 'pull_request' }}
        run: gradle assembleDebug --stacktrace
      - name: Build signed release APK
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GAME_KEYSTORE_PASSWORD: ${{ secrets.GAME_KEYSTORE_PASSWORD }}
          GAME_KEY_ALIAS: ${{ secrets.GAME_KEY_ALIAS }}
        run: gradle assembleRelease --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameSolution-apk
          path: ${{ github.event_name == 'pull_request' && 'app/build/outputs/apk/debug/app-debug.apk' || 'app/build/outputs/apk/release/app-release.apk' }}
          if-no-files-found: error
          retention-days: 30
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GameSolution-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v') && success()
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
