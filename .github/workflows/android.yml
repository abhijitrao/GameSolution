      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Run Android Lint
        run: gradle lintDebug --stacktrace
      - name: Build debug APK
        if: ${{ github.event_name == 'pull_request' }}
        run: gradle assembleDebug --stacktrace
      - name: Build signed release APK
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GAME_KEYSTORE_PASSWORD: ${{ secrets.GAME_KEYSTORE_PASSWORD }}
          GAME_KEY_ALIAS: ${{ secrets.GAME_KEY_ALIAS }}
        run: gradle assembleRelease --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameSolution-apk
          path: ${{ github.event_name == 'pull_request' && 'app/build/outputs/apk/debug/app-debug.apk' || 'app/build/outputs/apk/release/app-release.apk' }}
          if-no-files-found: error
          retention-days: 30
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GameSolution-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v') && success()
