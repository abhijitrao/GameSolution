name: Android CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore signing keystore
        if: ${{ github.event_name != 'pull_request' }}
        env:
          KEYSTORE_B64: ${{ secrets.GAME_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then exit 1; fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/gamesolution-release.jks"
          echo "GAME_KEYSTORE_FILE=$RUNNER_TEMP/gamesolution-release.jks" >> "$GITHUB_ENV"
      - name: Prepare source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/abhijit/gamesolution/LiveMonitorDialog.java')
          t=p.read_text(encoding='utf-8')
          marker='    private static int readCpuPercent(int pid) {'
          if 'private static int findPid(ActivityManager am, String packageName)' not in t:
            m='\n'.join(['    private static int findPid(ActivityManager am, String packageName) {','        if (am == null || packageName == null) return -1;','        try {','            java.util.List<ActivityManager.RunningAppProcessInfo> processes = am.getRunningAppProcesses();','            if (processes == null) return -1;','            for (ActivityManager.RunningAppProcessInfo process : processes) {','                if (process != null && packageName.equals(process.processName)) return process.pid;','            }','        } catch (Exception ignored) {}','        return -1;','    }',''])
            if marker not in t: raise SystemExit('LiveMonitor marker not found')
            p.write_text(t.replace(marker,m+marker,1),encoding='utf-8')
          f=Path('app/src/main/java/com/abhijit/gamesolution/FloatingService.java')
          s=f.read_text(encoding='utf-8')
          # Enforce the final Recent Apps design on every CI build, including when the method already exists.
          s=s.replace('d.setBounds(0,0,dp(32),dp(32));','d.setBounds(0,0,dp(48),dp(48));')
          s=s.replace('if(++count>=5)break;','if(++count>=4)break;')
          f.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/abhijit/gamesolution/FloatingService.java
          if ! git diff --cached --quiet; then
            git commit -m "Limit recent apps to four icons"
            git push
          fi
      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Run Android Lint
        run: gradle lintDebug --stacktrace
      - name: Build debug APK
        if: ${{ github.event_name == 'pull_request' }}
        run: gradle assembleDebug --stacktrace
      - name: Build signed release APK
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GAME_KEYSTORE_PASSWORD: ${{ secrets.GAME_KEYSTORE_PASSWORD }}
          GAME_KEY_ALIAS: ${{ secrets.GAME_KEY_ALIAS }}
        run: gradle assembleRelease --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameSolution-apk
          path: ${{ github.event_name == 'pull_request' && 'app/build/outputs/apk/debug/app-debug.apk' || 'app/build/outputs/apk/release/app-release.apk' }}
          if-no-files-found: error
          retention-days: 30
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GameSolution-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v') && success()
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
