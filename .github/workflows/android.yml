name: Android CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.GAME_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "GAME_KEYSTORE_BASE64 secret is not configured"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/gamesolution-release.jks"
          echo "GAME_KEYSTORE_FILE=$RUNNER_TEMP/gamesolution-release.jks" >> "$GITHUB_ENV"

      - name: Prepare bubble source
        run: python3 tools/prepare_bubble.py

      - name: Run unit tests
        run: gradle test

      - name: Run Android Lint
        run: gradle lint

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameSolution-debug-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          GAME_KEYSTORE_FILE: ${{ env.GAME_KEYSTORE_FILE }}
          GAME_KEYSTORE_PASSWORD: ${{ secrets.GAME_KEYSTORE_PASSWORD }}
          GAME_KEY_ALIAS: ${{ secrets.GAME_KEY_ALIAS }}
          GAME_KEY_PASSWORD: ${{ secrets.GAME_KEY_PASSWORD }}
        run: |
          if [ -z "$GAME_KEYSTORE_PASSWORD" ]; then
            echo "GAME_KEYSTORE_PASSWORD secret is not configured"
            exit 1
          fi
          if [ -z "$GAME_KEY_ALIAS" ]; then
            echo "GAME_KEY_ALIAS secret is not configured"
            exit 1
          fi
          gradle assembleRelease

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
