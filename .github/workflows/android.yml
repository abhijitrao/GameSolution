name: Android CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore signing keystore
        if: ${{ github.event_name != 'pull_request' }}
        env:
          KEYSTORE_B64: ${{ secrets.GAME_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then exit 1; fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/gamesolution-release.jks"
          echo "GAME_KEYSTORE_FILE=$RUNNER_TEMP/gamesolution-release.jks" >> "$GITHUB_ENV"
      - name: Prepare source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_method(source, signature, replacement):
              start = source.find(signature)
              if start < 0:
                  raise SystemExit(f'{signature} method not found')
              brace = source.find('{', start)
              if brace < 0:
                  raise SystemExit(f'{signature} opening brace not found')
              depth = 0
              for i in range(brace, len(source)):
                  if source[i] == '{':
                      depth += 1
                  elif source[i] == '}':
                      depth -= 1
                      if depth == 0:
                          return source[:start] + replacement + source[i + 1:]
              raise SystemExit(f'{signature} closing brace not found')

          p=Path('app/src/main/java/com/abhijit/gamesolution/LiveMonitorDialog.java')
          t=p.read_text(encoding='utf-8')
          marker='    private static int readCpuPercent(int pid) {'
          if 'private static int findPid(ActivityManager am, String packageName)' not in t:
            m='\n'.join(['    private static int findPid(ActivityManager am, String packageName) {','        if (am == null || packageName == null) return -1;','        try {','            java.util.List<ActivityManager.RunningAppProcessInfo> processes = am.getRunningAppProcesses();','            if (processes == null) return -1;','            for (ActivityManager.RunningAppProcessInfo process : processes) {','                if (process != null && packageName.equals(process.processName)) return process.pid;','            }','        } catch (Exception ignored) {}','        return -1;','    }',''])
            if marker not in t: raise SystemExit('LiveMonitor marker not found')
            p.write_text(t.replace(marker,m+marker,1),encoding='utf-8')

          f=Path('app/src/main/java/com/abhijit/gamesolution/FloatingService.java')
          s=f.read_text(encoding='utf-8')
          s=s.replace('row.setPadding(dp(8),0,dp(8),0);','row.setPadding(0,0,0,0);')
          s=s.replace('d.setBounds(0,0,dp(32),dp(32));','d.setBounds(0,0,dp(54),dp(54));')
          s=s.replace('d.setBounds(0,0,dp(48),dp(48));','d.setBounds(0,0,dp(54),dp(54));')
          s=s.replace('row.addView(icon,new LinearLayout.LayoutParams(0,dp(54),1));if(++count>=5)break;','row.addView(icon,new LinearLayout.LayoutParams(dp(54),dp(54)));if(++count>=4)break;')
          s=s.replace('row.addView(icon,new LinearLayout.LayoutParams(0,dp(54),1));if(++count>=4)break;','row.addView(icon,new LinearLayout.LayoutParams(dp(54),dp(54)));if(++count>=4)break;')
          s=s.replace('i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK|Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED);','i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK|Intent.FLAG_ACTIVITY_SINGLE_TOP);')
          s=s.replace('int sw=getResources().getDisplayMetrics().widthPixels,mw=dp(MENU_WIDTH_DP),gap=dp(MENU_GAP_DP);','int sw=getResources().getDisplayMetrics().widthPixels,mw=dp(MENU_WIDTH_DP),gap=dp(18);')
          s=s.replace('int sw=getResources().getDisplayMetrics().widthPixels,mw=dp(MENU_WIDTH_DP),gap=dp(MENU_GAP_DP+8);','int sw=getResources().getDisplayMetrics().widthPixels,mw=dp(MENU_WIDTH_DP),gap=dp(18);')

          new_move=''' private void moveBubbleForSemiSetting(boolean enabled){if(bubbleView==null)return;int sw=getResources().getDisplayMetrics().widthPixels;int sh=getResources().getDisplayMetrics().heightPixels;WindowManager.LayoutParams p=(WindowManager.LayoutParams)bubbleView.getLayoutParams();int w=Math.max(1,p.width);boolean right=p.x+w/2>=sw/2;if(enabled){p.x=right?sw-(2*w/3):-(w/3);}else{p.x=right?sw-w:0;}p.x=Math.max(enabled?-(w/3):0,Math.min(p.x,enabled?sw-(2*w/3):sw-w));p.y=Math.max(dp(48),Math.min(p.y,sh-w-dp(8)));windowManager.updateViewLayout(bubbleView,p);BubbleSettings.setPosition(this,p.x/(float)sw,p.y/(float)sh);}'''
          s=replace_method(s,' private void moveBubbleForSemiSetting(boolean enabled)',new_move)

          new_apply=''' private void applyBubbleSettings(){if(bubbleView==null)return;int size=BubbleSettings.getSize(this);WindowManager.LayoutParams p=(WindowManager.LayoutParams)bubbleView.getLayoutParams();int sw=getResources().getDisplayMetrics().widthPixels,sh=getResources().getDisplayMetrics().heightPixels;int oldW=Math.max(1,p.width),newW=dp(size);float centerX=p.x+oldW/2f,centerY=p.y+oldW/2f;boolean right=p.x+oldW/2>=sw/2;p.width=newW;p.height=newW;if(BubbleSettings.isSemiIconVisible(this)){p.x=right?sw-(2*newW/3):-(newW/3);}else{p.x=Math.max(0,Math.min((int)(centerX-newW/2f),sw-newW));}p.y=Math.max(dp(48),Math.min((int)(centerY-newW/2f),sh-newW-dp(8)));windowManager.updateViewLayout(bubbleView,p);bubbleView.setAlpha(BubbleSettings.getTransparency(this)/100f);BubbleSettings.setPosition(this,p.x/(float)sw,p.y/(float)sh);}'''
          s=replace_method(s,' private void applyBubbleSettings()',new_apply)

          f.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/abhijit/gamesolution/FloatingService.java
          if ! git diff --cached --quiet; then
            git commit -m "Fix semi bubble position and size anchoring"
            git push
          fi
      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Run Android Lint
        run: gradle lintDebug --stacktrace
      - name: Build debug APK
        if: ${{ github.event_name == 'pull_request' }}
        run: gradle assembleDebug --stacktrace
      - name: Build signed release APK
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GAME_KEYSTORE_PASSWORD: ${{ secrets.GAME_KEYSTORE_PASSWORD }}
          GAME_KEY_ALIAS: ${{ secrets.GAME_KEY_ALIAS }}
        run: gradle assembleRelease --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameSolution-apk
          path: ${{ github.event_name == 'pull_request' && 'app/build/outputs/apk/debug/app-debug.apk' || 'app/build/outputs/apk/release/app-release.apk' }}
          if-no-files-found: error
          retention-days: 30
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GameSolution-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v') && success()
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk